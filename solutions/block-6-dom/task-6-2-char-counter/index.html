<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task 6.2 — Character Counter</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f0f4f8;
        display: flex;
        justify-content: center;
        padding: 60px 16px;
        margin: 0;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 36px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      }
      h2 { margin-top: 0; color: #333; }
      label { font-size: 0.9rem; color: #555; display: block; margin-bottom: 6px; }

      textarea {
        width: 100%;
        height: 130px;
        resize: vertical;
        border: 2px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.3s;
        outline: none;
      }
      textarea:focus { border-color: #4a90d9; }

      .counter {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #555;
        text-align: right;
        transition: color 0.3s;
      }
      .counter.warning { color: #e67e22; font-weight: bold; }
      .counter.danger   { color: #e74c3c; font-weight: bold; }
      .counter.over     { color: #c0392b; font-weight: bold; }

      .progress-bar-track {
        height: 6px;
        background: #e0e0e0;
        border-radius: 4px;
        margin-top: 8px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: #4a90d9;
        border-radius: 4px;
        width: 0%;
        transition: width 0.2s ease, background-color 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>✍️ Live Character Counter</h2>
      <label for="messageInput">Your Message (max 100 characters):</label>
      <textarea id="messageInput" maxlength="100" placeholder="Start typing here..."></textarea>

      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>

      <p class="counter" id="counter">0 / 100 characters</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
