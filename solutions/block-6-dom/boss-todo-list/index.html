<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block 6 Boss — Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>🗒️ My Tasks</h1>
        <p id="taskCount" class="task-count">0 tasks remaining</p>
      </header>

      <!-- Input Area -->
      <div class="input-area">
        <input
          type="text"
          id="taskInput"
          placeholder="What needs to be done? Press Enter or click Add"
          autocomplete="off"
        />
        <button id="addBtn">Add ➕</button>
      </div>

      <!-- Task List -->
      <ul id="taskList"></ul>

      <!-- Footer -->
      <div class="footer" id="footer" style="display:none">
        <button id="clearAllBtn" class="clear-btn">🗑️ Clear All</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
